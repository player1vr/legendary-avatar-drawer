<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>降灵神通 · 传奇英灵领域卡抽卡器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23a78bfa'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'>灵</text></svg>">
<style>
:root{--bg:#12151b;--panel:#1a1e26;--card:#222836;--text:#e7eaef;--muted:#8b95a5;--accent:#a78bfa;--danger:#ef4444;--border:#2f3542;}
.light{--bg:#f4f6fb;--panel:#fff;--card:#fff;--text:#1f2937;--muted:#5b6472;--border:#e2e6ef;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.6;transition:background .2s,color .2s;}
header{padding:22px 20px 10px;border-bottom:1px solid var(--border);background:var(--panel);}
h1{margin:0 0 6px;font-size:22px;}
.sub{color:var(--muted);font-size:13px;}
.skill{border-left:3px solid var(--accent);padding-left:12px;margin:14px 0;font-size:13px;color:var(--text);}
.skill strong{color:var(--accent);}
.theme-btn{position:fixed;top:12px;right:12px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px;z-index:20;}
main{max-width:980px;margin:0 auto;padding:20px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.panel h2{margin:0 0 12px;font-size:15px;color:var(--accent);}
.domains{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px;user-select:none;transition:border-color .15s;}
.chip:hover{border-color:var(--accent);}
.chip input{margin:0;}
.chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;}
.controls label{font-size:13px;color:var(--muted);}
.controls input[type=number]{width:60px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px;}
.btn{border:0;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;font-weight:600;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{border-color:var(--accent);}
.hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5;}
.status{font-size:13px;color:var(--muted);margin:8px 0 0;}
.drawn{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px;}
.c{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;position:relative;display:flex;flex-direction:column;}
.c.slot{min-height:210px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.c.slot.locked{display:block;min-height:auto;}
.c h3{margin:0;font-size:15px;}
.c .meta{font-size:12px;color:var(--muted);margin:6px 0 10px;}
.c .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.tag{font-size:11px;padding:2px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--border);}
.c .effect{font-size:13px;color:var(--text);flex:1;max-height:260px;overflow:auto;white-space:pre-line;}
.c .effect strong{color:#fff;background:rgba(255,255,255,.12);padding:0 3px;border-radius:3px;}
.light .c .effect strong{background:rgba(0,0,0,.08);color:#111;}
.c .del{position:absolute;top:8px;right:8px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;}
.c .del:hover{border-color:var(--danger);color:var(--danger);}
.slot-flick{font-size:19px;font-weight:700;text-align:center;line-height:1.3;padding:0 10px;animation:flick .12s linear infinite;letter-spacing:1px;}
@keyframes flick{0%{opacity:.4;transform:translateY(-2px);}100%{opacity:.95;transform:translateY(2px);}}
.flash{animation:flash .45s ease;}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(167,139,250,0);}35%{box-shadow:0 0 0 3px rgba(167,139,250,.7);}100%{box-shadow:0 0 0 0 rgba(167,139,250,0);}}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;}
.fade{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.dissipated{color:var(--danger);font-weight:700;}
</style></head><body>
<button class="theme-btn" onclick="toggleTheme()">切换主题</button>
<header>
<h1>降灵神通 · 传奇英灵领域卡抽卡器</h1>
<div class="sub">数据来源：匕首之心 HTML SRD（daggerheart.cn/SRD/）</div>
<div class="skill">
  <strong>降灵神通</strong>：8级 灵魂 法术 · 回想费用：2<br>
  每长休一次，花费 2 希望点，召唤一个传奇英灵。选择一个灵魂领域外的领域，洗混领域卡，从中抽取 5 张，配置在此卡旁，作为该传奇英灵可用的领域卡。<br>
  规则：每进行一次动作掷骰，或英灵受到任意数量伤害，移除 1 张领域卡。领域卡全部移除时，该英灵消散。
</div>
</header>
<main>
<div class="panel"><h2>来源领域（可多选，默认第一个）</h2><div class="domains" id="domains"></div></div>
<div class="panel"><h2>筛选等级（可多选）</h2><div class="domains" id="levels"></div></div>
<div class="panel">
  <div class="controls">
    <label>抽取数量：<input type="number" id="drawCount" value="5" min="1" max="10"></label>
    <button class="btn btn-primary" id="drawBtn" onclick="draw()">抽取领域卡</button>
    <button class="btn btn-danger" onclick="clearAll()">全部移除</button>
    <button class="btn btn-ghost" onclick="copyLink()">复制分享链接</button>
    <button class="btn btn-ghost" onclick="downloadOffline()">下载离线版</button>
    <span class="status" id="status"></span>
  </div>
  <div class="hint">提示：点「下载离线版」可把整个工具存成单个 HTML 文件，断网、换设备、自行托管都能用，不再依赖此链接。</div>
</div>
<div id="result"></div>
</main>
<script>
const DOMAINS = [{"cn": "奥术", "en": "ARCANA"}, {"cn": "利刃", "en": "BLADE"}, {"cn": "骸骨", "en": "BONE"}, {"cn": "典籍", "en": "CODEX"}, {"cn": "优雅", "en": "GRACE"}, {"cn": "午夜", "en": "MIDNIGHT"}, {"cn": "贤者", "en": "SAGE"}, {"cn": "辉耀", "en": "SPLENDOR"}, {"cn": "勇气", "en": "VALOR"}];
const CARDS = [{"name": "符文护符 RUNE WARD", "domain": "奥术", "domain_en": "ARCANA", "level": 1, "type": "法术", "recall": 0, "effect": "你拥有一件意义深远的个人小饰品，可以注入防护魔法，由你或一位盟友持有作为护身符。描述一下它是什么以及它对你为何重要。持有护身符的人可以<strong>花费 1 希望点</strong>来减少即将到来的伤害，数值为 <strong>1d8</strong>。\n如果掷出的结果是 <strong>8</strong> ，则该护身符在本回合减少伤害后其力量消失。你可以在下次休息时免费为其充能。", "meta": "1 级 奥术 法术 回想费用：0"}, {"name": "释放混沌 UNLEASH CHAOS", "domain": "奥术", "domain_en": "ARCANA", "level": 1, "type": "法术", "recall": 1, "effect": "在一场游戏开始时，在此牌上放置数量等同于你施法属性值的指示物。\n对远距离范围内的一个目标进行一次<strong>施法掷骰</strong>，并花费任意数量的指示物，引导你内在的原始能量向其释放。成功时，掷出等同于你花费指示物数量的 <strong>d10</strong>，对目标造成等量的魔法伤害。<strong>标记 1 压力点</strong>以补满此牌上的指示物（最多至你的施法属性值）。在每场游戏结束时，清除所有未使用的指示物。", "meta": "1 级 奥术 法术 回想费用：1"}, {"name": "墙面行走 WALL WALK", "domain": "奥术", "domain_en": "ARCANA", "level": 1, "type": "法术", "recall": 1, "effect": "<strong>花费 1 希望点</strong>，让你能接触到的生物可以像在地面上行走一样轻松地攀爬墙壁和天花板。此效果持续到场景结束，或直到你再次施放墙面行走。", "meta": "1 级 奥术 法术 回想费用：1"}, {"name": "余烬之握 CINDER GRASP", "domain": "奥术", "domain_en": "ARCANA", "level": 2, "type": "法术", "recall": 1, "effect": "对近战范围内的一个目标进行一次<strong>施法掷骰</strong>。成功时，目标会立即燃起火焰，受到 <strong>1d20+3</strong> 点魔法伤害，并暂时处于 <em>点燃</em> 状态。\n当一个生物在 <em>点燃</em> 状态下使用动作时，如果在其动作结束时仍具有 <em>点燃</em> 状态，则必须额外受到 <strong>2d6</strong> 点魔法伤害。", "meta": "2 级 奥术 法术 回想费用：1"}, {"name": "浮游之眼 FLOATING EYE", "domain": "奥术", "domain_en": "ARCANA", "level": 2, "type": "法术", "recall": 0, "effect": "<strong>花费 1 希望点</strong>，创造一个小型浮游光球，你可以在极远距离范围内将其移动到任何地方。当此法术激活时，你可以通过光球观察，如同你正从其位置向外看一样。你可以在使用自己的感官和通过光球视物之间自由切换。如果光球受到伤害或离开范围，法术结束。", "meta": "2 级 奥术 法术 回想费用：0"}, {"name": "法术反制 COUNTERSPELL", "domain": "奥术", "domain_en": "ARCANA", "level": 3, "type": "法术", "recall": 2, "effect": "你可以通过使用你的施法属性进行一次反应掷骰中断正在发生的魔法效果。成功时，效果停止，并且避免任何后果，此卡被放入你的宝库。", "meta": "3 级 奥术 法术 回想费用：2"}, {"name": "飞行奇术 FLIGHT", "domain": "奥术", "domain_en": "ARCANA", "level": 3, "type": "法术", "recall": 1, "effect": "进行一次<strong>施法掷骰 (15)</strong>。成功时，在此卡上放置等同于你敏捷属性数量的指示物（最少 <strong>1</strong> 个）。当你在飞行时进行一次动作掷骰时，从这张卡上花费一个指示物。在花费最后一个指示物的行动结算后，你将直接降落到你正下方的地面上。", "meta": "3 级 奥术 法术 回想费用：1"}, {"name": "闪烁现身 BLINK OUT", "domain": "奥术", "domain_en": "ARCANA", "level": 4, "type": "法术", "recall": 1, "effect": "进行一次<strong>施法掷骰 (12)</strong>。成功时，<strong>花费 1 希望点</strong>传送到你在远距离范围内能看到的另一个点。如果任何自愿的生物在邻近范围内，为每个生物额外<strong>花费 1 希望点</strong>以将其带上。", "meta": "4 级 奥术 法术 回想费用：1"}, {"name": "护身爆发 PRESERVATION BLAST", "domain": "奥术", "domain_en": "ARCANA", "level": 4, "type": "法术", "recall": 2, "effect": "对近战范围内的所有目标进行一次<strong>施法掷骰</strong>。你成功对抗的目标将被迫后退至远距离范围处，并使用你的施法属性使其受到 <strong>d8+3</strong> 点魔法伤害。", "meta": "4 级 奥术 法术 回想费用：2"}, {"name": "连锁闪电 CHAIN LIGHTNING", "domain": "奥术", "domain_en": "ARCANA", "level": 5, "type": "法术", "recall": 1, "effect": "<strong>标记 2 压力点</strong>以进行一次<strong>施法掷骰</strong>，对近距离范围内的所有目标释放闪电。你成功对抗的目标必须进行一次反应掷骰，难度等于你的施法掷骰结果。掷骰失败的目标受到 <strong>2d8+4</strong> 点魔法伤害。未被连锁闪电指定，且在受到伤害的前一个目标近距离范围内的额外敌人，也必须进行反应掷骰。掷骰失败的目标受到 <strong>2d8+4</strong> 点魔法伤害。此连锁效应持续至范围内没有更多敌对生物为止。", "meta": "5 级 奥术 法术 回想费用：1"}, {"name": "预见未来 PREMONITION", "domain": "奥术", "domain_en": "ARCANA", "level": 5, "type": "法术", "recall": 2, "effect": "你可以引导奥术能量来预见未来。每长休一次，在游戏主持人告知你进行的一次掷骰结果后，你可以立即撤销该行动及其结果，如同它们从未发生过一样，并以另一行动替代。", "meta": "5 级 奥术 法术 回想费用：2"}, {"name": "裂隙行者 RIFT WALKER", "domain": "奥术", "domain_en": "ARCANA", "level": 6, "type": "法术", "recall": 2, "effect": "进行一次<strong>施法掷骰 (15)</strong>。成功时，你在当前站立的地面上放置一个奥术标记。下次你成功施放裂隙行者时，空间中会打开一道裂隙，提供一条能够返回标记所在精确位置的安全通道。这道裂隙会保持开启，直到你选择关闭它或施放另一个法术。\n你可以在任何时候取消该法术，以便再次施放裂隙行者并将标记放置在新的位置。", "meta": "6 级 奥术 法术 回想费用：2"}, {"name": "心灵遥控 TELEKINESIS", "domain": "奥术", "domain_en": "ARCANA", "level": 6, "type": "法术", "recall": 0, "effect": "对远距离范围内的一个目标进行一次<strong>施法掷骰</strong>。成功时，你可以用意念将其移动到其原位置远距离范围内的任何地方。你可以进行一次额外的施法掷骰，将被举起的目标投掷出去用于攻击第二个目标。成功时，使用你的熟练值对第二个目标造成 <strong>d12+4</strong> 点物理伤害。此法术随后结束。", "meta": "6 级 奥术 法术 回想费用：0"}, {"name": "奥术恩泽 ARCANA-TOUCHED", "domain": "奥术", "domain_en": "ARCANA", "level": 7, "type": "能力", "recall": 2, "effect": "当你的配置中有 <strong>4</strong> 张或更多领域卡来自奥术领域时，获得下列增益：\n- 施法掷骰获得 <strong>+1</strong> 加值\n- 每次休息一次，你可以交换你的希望骰和恐惧骰的结果。", "meta": "7 级 奥术 能力 回想费用：2"}, {"name": "匿踪诡术 CLOAKING BLAST", "domain": "奥术", "domain_en": "ARCANA", "level": 7, "type": "法术", "recall": 2, "effect": "当你成功进行<strong>施法掷骰</strong>施放其他法术时，你可以<strong>花费 1 希望点</strong>来获得 <em>隐匿</em> 状态。处于 <em>隐匿</em> 状态时，如果当敌人移动到通常能看到你的位置时你保持静止，你将保持不被看见。当你移动进入或在敌人的视线范围内移动，或进行攻击时，你将不再处于 <em>隐匿</em> 状态。", "meta": "7 级 奥术 法术 回想费用：2"}, {"name": "奥术反射 ARCANE REFLECTION", "domain": "奥术", "domain_en": "ARCANA", "level": 8, "type": "法术", "recall": 1, "effect": "当你将要受到魔法伤害时，你可以<strong>花费任意数量的希望</strong>来掷出同等数量的 <strong>d6</strong>。如果任何一个骰子掷出 <strong>6</strong> ，该攻击将被反射回施法者，转而对其造成伤害。", "meta": "8 级 奥术 法术 回想费用：1"}, {"name": "惑像灵光 CONFUSING AURA", "domain": "奥术", "domain_en": "ARCANA", "level": 8, "type": "法术", "recall": 2, "effect": "进行一次<strong>施法掷骰 (14)</strong>。每长休一次，成功后，你在身体周围创造一层幻象，使人难以确定你的确切位置。<strong>标记任意数量的压力点</strong>以创造等量的额外层数。当敌人对你进行攻击时，掷出等同于当前活跃层数数量的 <strong>d6</strong>。如果任何骰子掷出 <strong>5</strong> 或更高，摧毁一层灵光，且该攻击失败。如果所有结果都为 <strong>4</strong> 或更低，你承受伤害，并且该法术结束。", "meta": "8 级 奥术 法术 回想费用：2"}, {"name": "地动山摇 EARTHQUAKE", "domain": "奥术", "domain_en": "ARCANA", "level": 9, "type": "法术", "recall": 2, "effect": "进行一次<strong>施法掷骰 (16)</strong>。每次休息一次，成功后，极远距离范围内所有不处于飞行中的目标必须进行一次反应掷骰 (18)。失败的目标承受 <strong>3d10+8</strong> 点物理伤害并暂时处于 <em>脆弱</em> 状态。成功的目标承受一半伤害。\n此外，当你成功进行施法掷骰时，极远距离范围内的所有地形变得难以通行，并且该范围内的建筑可能会受到伤害或坍塌。", "meta": "9 级 奥术 法术 回想费用：2"}, {"name": "感官投射 SENSORY PROJECTION", "domain": "奥术", "domain_en": "ARCANA", "level": 9, "type": "法术", "recall": 0, "effect": "每次休息一次，进行一次<strong>施法掷骰 (15)</strong>。成功后，进入一个幻象，让你清晰地看见和听见你曾去过的任何地方，仿佛你此刻正身临其境。你可以在此幻象中自由移动，不受物理身体的物理或阻碍限制。此法术无法通过普通或魔法手段被侦测到。你在受到伤害或施放另一个法术时会脱离此幻象。", "meta": "9 级 奥术 法术 回想费用：0"}, {"name": "调整现实 ADJUST REALITY", "domain": "奥术", "domain_en": "ARCANA", "level": 10, "type": "法术", "recall": 1, "effect": "在你或一个自愿的盟友进行任何掷骰后，你可以<strong>花费 5 希望点</strong>来将该掷骰的数值结果改变为你选择的 "不可侵犯 UNTOUCHABLE", "domain": "骸骨", "domain_en": "BONE", "level": 1, "type": "能力", "recall": 1, "effect": "你的闪避值获得等同于你敏捷值一半的加值。", "meta": "1 级 骸骨 能力 回想费用：1"}, {"name": "凶猛残暴 FEROCITY", "domain": "骸骨", "domain_en": "BONE", "level": 2, "type": "能力", "recall": 2, "effect": "当你使一个敌人<strong>标记 1 或更多生命点</strong>时，你可以<strong>花费 2 希望点</strong>，你的闪避值提高等同于其已被标记的生命点数。此加值持续到对你进行的下一次攻击之后。", "meta": "2 级 骸骨 能力 回想费用：2"}, {"name": "战术方针 STRATEGIC APPROACH", "domain": "骸骨", "domain_en": "BONE", "level": 2, "type": "能力", "recall": 1, "effect": "在一次长休后，在此卡上放置等同于你知识属性值的指示物（最少 <strong>1</strong> 个）。当你第一次移动到与一个敌人处于近距离范围以内并对其进行攻击时，你可以花费一个指示物来选择下列选项之一：\n- 你进行此次攻击时具有优势。\n- 你使一个处于该敌人近战范围内的盟友<strong>清除 1 压力点</strong>。\n- 你在你的伤害掷骰中增加一个 <strong>d8</strong>。\n当你进行长休时，清除所有未使用的指示物。", "meta": "2 级 骸骨 能力 回想费用：1"}, {"name": "警戒防备 BRACE", "domain": "骸骨", "domain_en": "BONE", "level": 3, "type": "能力", "recall": 1, "effect": "当你<strong>标记 1 护甲槽</strong>来减少受到的伤害时，你可以<strong>标记 1 压力点</strong>来额外<strong>标记 1 护甲槽</strong>。", "meta": "3 级 骸骨 能力 回想费用：1"}, {"name": "战术行家 TACTICIAN", "domain": "骸骨", "domain_en": "BONE", "level": 3, "type": "能力", "recall": 1, "effect": "当你帮助一个盟友时，其可以<strong>花费 1 希望点</strong>，将你的一项经历作为加值加入其掷骰结果中，并与你的优势骰一同掷出。\n进行接力掷骰时，你可以掷一个 <strong>d20</strong> 作为你的希望骰。", "meta": "3 级 骸骨 能力 回想费用：1"}, {"name": "高高跃起 BOOST", "domain": "骸骨", "domain_en": "BONE", "level": 4, "type": "能力", "recall": 1, "effect": "<strong>标记 1 压力点</strong>，从近距离范围内的自愿盟友处借力，冲向空中，对远距离范围内的一个目标进行一次空中攻击。这次攻击你获得优势，在伤害掷骰中额外加上一个 <strong>d10</strong>，并在目标近战范围内结束你的行动。", "meta": "4 级 骸骨 能力 回想费用：1"}, {"name": "借力打力 REDIRECT", "domain": "骸骨", "domain_en": "BONE", "level": 4, "type": "能力", "recall": 1, "effect": "当一次来自近战范围之外、针对你的攻击失败时，掷出等同于你熟练值的 <strong>d6</strong>。如果任意一个骰子掷出 <strong>6</strong> ，你可以<strong>标记 1 压力点</strong>，将这次攻击改为对邻近范围内的一名敌人造成伤害。", "meta": "4 级 骸骨 能力 回想费用：1"}, {"name": "知己知彼 KNOW THY ENEMY", "domain": "骸骨", "domain_en": "BONE", "level": 5, "type": "能力", "recall": 1, "effect": "观察一个生物时，你可以对其进行一次<strong>本能掷骰</strong>。成功时，<strong>花费 1 希望点</strong>并向游戏主持人询问目标下列选项中的一组信息：\n- 其未标记的生命点和压力点。\n- 其难度和伤害阈值。\n- 其战术和普通攻击伤害骰。\n- 其特性和经历。\n此外，成功时，你可以<strong>标记 1 压力点</strong>从游戏主持人恐惧池中<strong>清除 1 恐惧点</strong>。", "meta": "5 级 骸骨 能力 回想费用：1"}, {"name": "招牌动作 SIGNATURE MOVE", "domain": "骸骨", "domain_en": "BONE", "level": 5, "type": "能力", "recall": 1, "effect": "命名并描述你的招牌战斗动作。每次休息一次，当你执行此招牌动作作为你所采取行动的一部分时，你可以将一个 <strong>d20</strong> 作为你的希望骰进行掷骰。成功时，<strong>清除 1 压力点</strong>。", "meta": "5 级 骸骨 能力 回想费用：1"}, {"name": "迅速报复 RAPID RIPOSTE", "domain": "骸骨", "domain_en": "BONE", "level": 6, "type": "能力", "recall": 0, "effect": "当一次来自近战范围内、针对你的攻击失败时，你可以<strong>标记 1 压力点</strong>并抓住机会，对攻击者造成你一件已装备武器的武器伤害。", "meta": "6 级 骸骨 能力 回想费用：0"}, {"name": "恢复如新 RECOVERY", "domain": "骸骨", "domain_en": "BONE", "level": 6, "type": "能力", "recall": 1, "effect": "在一次短休期间，你可以选择进行一次长休的休整行动。你可以<strong>花费 1 希望点</strong>让一个盟友也同样进行选择。", "meta": "6 级 骸骨 能力 回想费用：1"}, {"name": "骸骨恩泽 BONE-TOUCHED", "domain": "骸骨", "domain_en": "BONE", "level": 7, "type": "能力", "recall": 2, "effect": "当你的配置中有 <strong>4</strong> 张或更多领域卡来自骸骨领域时，获得下列增益：\n- 敏捷 <strong>+1</strong><br/>\n- 每次休息一次，你可以<strong>花费 3 希望点</strong>，使一次针对你的成功攻击转为失败。", "meta": "7 级 骸骨 能力 回想费用：2"}, {"name": "残酷精准 CRUEL PRECISION", "domain": "骸骨", "domain_en": "BONE", "level": 7, "type": "能力", "recall": 1, "effect": "当你使用武器成功攻击时，你的伤害掷骰获得等同于你的灵巧或敏捷的加值。", "meta": "7 级 骸骨 能力 回想费用：1"}, {"name": "碎骨打击 BREAKING BLOW", "domain": "骸骨", "domain_en": "BONE", "level": 8, "type": "能力", "recall": 3, "effect": "当你进行一次成功的攻击时，你可以<strong>标记 1 压力点</strong>，使下一次成功针对同一目标的攻击额外造成 <strong>2d12</strong> 点伤害。", "meta": "8 级 骸骨 能力 回想费用：3"}, {"name": "缠斗乱战 WRANGLE", "domain": "骸骨", "domain_en": "BONE", "level": 8, "type": "能力", "recall": 1, "effect": "对近距离范围内的所有目标进行一次敏捷掷骰。<strong>花费 1 希望点</strong>，将你成功对抗的目标，以及近距离范围内的任意自愿盟友，移动到近距离范围内的另一个位置。", "meta": "8 级 骸骨 能力 回想费用：1"}, {"name": "生死边缘 ON THE BRINK", "domain": "骸骨", "domain_en": "BONE", "level": 9, "type": "能力", "recall": 1, "effect": "当你未标记的生命点为 <strong>2</strong> 点或更少时，你不会受到轻度伤害。", "meta": "9 级 骸骨 能力 回想费用：1"}, {"name": "分裂打击 SPLINTERING STRIKE", "domain": "骸骨", "domain_en": "BONE", "level": 9, "type": "能力", "recall": 3, "effect": "<strong>花费 1 希望点</strong>，对你武器射程内的所有敌人进行一次攻击。每长休一次，对任意目标成功时，掷出你的武器伤害，然后你可以随意将这些伤害分配给你成功对抗的目标。当你对每一个目标造成伤害前，掷出一个额外的伤害骰，将其结果加入你对该目标造成的伤害中。", "meta": "9 级 骸骨 能力 回想费用：3"}, {"name": "死亡奔袭 DEATHRUN", "domain": "骸骨", "domain_en": "BONE", "level": 10, "type": "能力", "recall": 1, "effect": "<strong>花费 3 希望点</strong>，在战场上沿直线奔跑，直至到达远距离范围内的某个点，并对该路径上你武器射程内的所有敌人进行一次攻击。选择你成功对抗的目标造成伤害的顺序。对第一个目标掷出你的武器伤害骰时，你的熟练值获得 <strong>+1</strong> 加值。然后从你的伤害掷骰中移除一个骰子，并将剩余的伤害分配给下一个目标。每个后续目标均移除一个骰子，直到你没有更多的伤害骰或敌人为止。\n每次攻击不能以同一个敌人为目标超过一次。", "meta": "10 级 骸骨 能力 回想费用：1"}, {"name": "闪转腾挪 SWIFT STEP", "domain": "骸骨", "domain_en": "BONE", "level": 10, "type": "能力", "recall": 2, "effect": "当一次针对你的攻击失败时，<strong>清除 1 压力点</strong>。你无压力点可供清除时，则<strong>获得 1 希望点</strong>。", "meta": "10 级 骸骨 能力 回想费用：2"}, {"name": "艾娃之书 BOOK OF AVA", "domain": "典籍", "domain_en": "CODEX", "level": 1, "type": "术典", "recall": 2, "effect": "<strong><em>强力推撞：</em></strong> 对近战范围内的一个目标进行一次<strong>施法掷骰</strong>。成功时，目标被击退至远距离范围处，并受到使用你熟练值的 <strong>d10+2</strong> 点魔法伤害。\n<strong><em>塔瓦的护甲：</em></strong> <strong>花费 1 希望点</strong>，使你触碰到的一个目标护甲值获得 <strong>+1</strong> 加值，直到其下次休息或你再次施放塔瓦的护甲。\n<strong><em>冰刺：</em></strong> 进行一次<strong>施法掷骰 (12)</strong>，在远距离范围内召唤一根巨大的冰刺。如果你将其用作武器，则改为对目标的难度进行施法掷骰。成功时，造成使用你熟练值的 <strong>d6</strong> 点物理伤害。", "meta": "1 级 典籍 术典 回想费用：2"}, {"name": "伊利亚特之书 BOOK OF ILLIAT", "domain": "典籍", "domain_en": "CODEX", "level": 1, "type": "术典", "recall": 2, "effect": "<strong><em>睡眠术：</em></strong> 对邻近范围内的一个目标进行一次<strong>施法掷骰</strong>。成功时，目标处于 <em>睡眠</em> 状态，直到受到伤害或游戏主持人在其轮次<strong>花费 1 恐惧点</strong>以清除此状态。\n<strong><em>奥术弹幕：</em></strong> 每次休息一次，<strong>花费任意数量的希望点</strong>，射出魔法投射物，攻击近距离范围内你选择的一个目标。掷出等同于花费希望点数量的 <strong>d6</strong>，对目标造成等量魔法伤害。\n<strong><em>心灵感应：</em></strong> <strong>花费 1 希望点</strong>，与一个你能看见的目标建立精神连接。此连接持续到你下次休息或你再次施放心灵感应。", "meta": "1 级 典籍 术典 回想费用：2"}, {"name": "提法之书 BOOK OF TYFAR", "domain": "典籍", "domain_en": "CODEX", "level": 1, "type": "术典", "recall": 2, "effect": "<strong><em>狂野明焰：</em></strong> 对近战范围内最多三个敌人进行一次<strong>施法掷骰</strong>。一团火焰在你的手中爆发，你成功对抗的每个目标受到 <strong>2d6</strong> 点魔法伤害且其必须<strong>标记 1 压力点</strong>。\n<strong><em>魔法之手：</em></strong> 你在远距离范围内召唤出一只大小和力道与你自己的手相同的魔法之手。\n<strong><em>神秘迷雾：</em></strong> 进行一次<strong>施法掷骰 (13)</strong>，施放一片临时的浓雾，聚集在自身邻近范围内的固定区域。迷雾严重遮蔽该区域及其中的一切。", "meta": "1 级 典籍 术典 回想费用：2"}, {"name": "斯泰尔之书 BOOK OF SITIL", "domain": "典籍", "domain_en": "CODEX", "level": 2, "type": "术典", "recall": 2, "effect": "<strong><em>改变容貌：</em></strong> 通过魔法改变你的外貌和衣着，从而避免被认出。\n<strong><em>平行复制：</em></strong> <strong>花费 2 希望点</strong>，对你或近距离范围内的一个盟友施放此法术。目标下次进行攻击时，可以额外攻击范围内另一个其攻击掷骰成功对抗的目标。你一次只能对一个生物维持此法术。\n<strong><em>幻象：</em></strong> 进行一次<strong>施法掷骰 (14)</strong>。成功时，在近距离范围内创造一个不超过你大小的临时视觉幻象，只要你看着它，幻象就会持续存在。幻象能够承受仔细观察，直到观察者进入其近战范围。", "meta": "2 级 典籍 术典 回想费用：2"}, {"name": "瓦格拉斯之书 BOOK OF VAGRAS", "domain": "典籍", "domain_en": "CODEX", "level": 2, "type": "术典", "recall": 2, "effect": "<strong><em>符文锁：</em></strong> 对你正在触碰的可以关闭的物体（如锁、箱子或盒子）进行一次<strong>施法掷骰 (15)</strong>。每次休息一次，成功时，你可以锁定该物体，使其只能由你选择的生物打开。拥有施法能力并且花费一小时研究该法术的人可以将其打破。\n<strong><em>奥术之门：</em></strong> 当你近战范围内没有敌人时，进行一次<strong>施法掷骰 (13)</strong>。成功时，<strong>花费 1 希望点</strong>，从你所在的位置到你能看见的远距离范围内的一个点创造一个传送门。有生物穿过它后，它就会关闭。\n<strong><em>揭示：</em></strong> 进行一次<strong>施法掷骰</strong>。如果近距离范围内有任何被魔法隐藏的东西，它就会被揭示出来。", "meta": "2 级 典籍 术典 回想费用：2"}, {"name": "库瓦斯之书 BOOK OF KORVAX", "domain": "典籍", "domain_en": "CODEX", "level": 3, "type": "术典", "recall": 2, "effect": "<strong><em>浮空术：</em></strong> 进行一次<strong>施法掷骰</strong>，暂时将一个你能看见的目标抬升到空中，并在其原位置的近距离范围内移动目标。\n<strong><em>记忆倒回：</em></strong> <strong>花费 1 希望点</strong>，迫使近战范围内的一个目标进行一次反应掷骰 (15)。失败时，对方会忘记你们谈话的最后一分钟。\n<strong><em>符文圆环：</em></strong> <strong>标记 1 压力点</strong>，在你站立的地方创造一个临时的魔法圆环。所有近战范围内的敌人，或者进入近战范围的敌人，受到 <strong>2d12+4</strong> 点魔法伤害，并被击退至邻近范围处。", "meta": "3 级 典籍 术典 回想费用：2"}, {"name": "诺莱伊之书 BOOK OF NORAI", "domain": "典籍", "domain_en": "CODEX", "level": 3, "type": "术典", "recall": 2, "effect": "<strong><em>神秘锁链：</em></strong> 对远距离范围内的一个目标进行一次<strong>施法掷骰</strong>。成功时，其暂时处于 <em>束缚</em> 状态且必须<strong>标记 1 压力点</strong>。如果你以一个飞行生物为目标，此法术会将其击落并使其暂时处于 <em>束缚</em> 状态。\n<strong><em>火球术：</em></strong> 对极远距离范围内的一个目标进行一次<strong>施法掷骰</strong>。成功时，向其投掷一个火球，火球在撞击时爆炸。目标和其邻近范围内的所有生物必须进行一次反应掷骰 (13)。失败的目标受到使用你的熟练值的 <strong>d20+5</strong> 点魔法伤害。成功的目标受到一半伤害。", "meta": "3 级 典籍 术典 回想费用：2"}, {"name": "埃索塔之书 BOOK OF EXOTA", "domain": "典籍", "domain_en": "CODEX", "level": 4, "type": "术典", "recall": 3, "effect": "<strong><em>否决术：</em></strong> 你可以中断正在发生的魔法效果。使用你的施法属性进行一次反应掷骰。每次休息一次，成功时，效果停止，并避免任何后果。\n<strong><em>创造构装体：</em></strong> <strong>花费 1 希望点</strong>，选择你周围的一组物体，并从中创造一个活化构装体，其服从基本命令。\n进行一次<strong>施法掷骰</strong>来命令其采取行动。必要时，其共享你的闪避值和属性，并且其攻击可造成 <strong>2d10+3</strong> 点物理伤害。你一次只能维持一个构装体，当它们受到任何伤害时就会散架。", "meta": "4 级 典籍 术典 回想费用：3"}, {"name": "格林之书 BOOK OF GRYNN", "domain": "典籍", "domain_en": "CODEX", "level": 4, "type": "术典", "recall": 2, "effect": "<strong><em>奥术偏转：</em></strong> 每长休一次，<strong>花费 1 希望点</strong>来抵消针对你或邻近范围内盟友的攻击伤害。\n<strong><em>时滞之锁：</em></strong> 指定远距离范围内的一个物体。该物体在时间和空间中停滞，直到你下次休息。如果一个生物试图移动它，对其进行一次<strong>施法掷骰</strong>来维持此法术。\n<strong><em>火焰墙：</em></strong> 进行一次<strong>施法掷骰 (15)</strong>。成功时，在远距离范围内的两点之间创造一道临时性的魔法火焰墙。所有在其路径上的生物必须选择站在哪一侧，随后穿过火焰墙的任何物体都会受到 <strong>4d10+3</strong> 点魔法伤害。", "meta": "4 级 典籍 术典 回想费用：2"}, {"name": "具现之墙 MANIFEST WALL", "domain": "典籍", "domain_en": "CODEX", "level": 5, "type": "法术", "recall": 2, "effect": "进行一次<strong>施法掷骰 (15)</strong>。每次休息一次，成功时，<strong>花费 1 希望点</strong>在远距离范围内的两点之间创造一道临时的魔法墙。它最高可达 <strong>50</strong> 英尺，并可以呈任何角度。在其路径上的生物或物体会被推到你选择的一侧。这道墙会一直存在，直到你下次休息或再次施放具现之墙。", "meta": "5 级 典籍 法术 回想费用：2"}, {"name": "传送术 TELEPORT", "domain": "典籍", "domain_en": "CODEX", "level": 5, "type": "法术", "recall": 2, "effect": "每长休一次，你可以立即将自己以及近距离范围内任意数量的自愿目标传送到你曾经去过的地方。选择下列选项之一，然后进行一次<strong>施法掷骰 (16)</strong>：\n- 如果你对这个地方非常熟悉，获得 <strong>+3</strong> 加值。\n- 如果你经常去这个地方，获得 <strong>+1</strong> 加值。\n- 如果你很少去这个地方，不获得调整值。\n- 如果你只去过那里一次，获得 <strong>−2</strong> 减值。\n成功时，你出现在你打算去的地方。失败时，你出现在偏离预定地点的地方，偏离的距离取决于失败的程度。", "meta": "5 级 典籍 法术 回想费用：2"}, {"name": "放逐术 BANISH", "domain": "典籍", "domain_en": "CODEX", "level": 6, "type": "法术", "recall": 0, "effect": "对近距离范围内的一个目标进行一次<strong>施法掷骰</strong>。成功时，掷出等同于你施法属性的 <strong>d20</strong>。目标必须进行一次反应掷骰，难度等同于你最高掷骰结果。成功时，目标必须<strong>标记 1 压力点</strong>，但不会被放逐。每休息一次，失败时，其被放逐出这个界域。\n当任意一名玩家角色掷出恐惧结果时，难度获得 <strong>−1</strong> 减值，且目标再进行一次反应掷骰。成功时，目标从放逐中返回。", "meta": "6 级 典籍 法术 回想费用：0"}, {"name": "惩戒符印 SIGIL OF RETRIBUTION", "domain": "典籍", "domain_en": "CODEX", "level": 6, "type": "法术", "recall": 2, "effect": "在近距离范围内的一个敌人身上标记一个惩戒符印。游戏主持人<strong>获得 1 恐惧点</strong>。当被标记的敌人对你或你的盟友造成伤害时，在此卡牌上放置一个 <strong>d8</strong>。你最多可以持有等同于你等级数量的 <strong>d8</strong>。当你成功攻击被标记的敌人时，掷出此卡牌上的骰子并将总和加入你的伤害掷骰中，然后移除对应骰子。当被标记的敌人被击败或你再次施放惩戒符印时，此效果结束。", "meta": "6 级 典籍 法术 回想费用：2"}, {"name": "霍梅特之书 BOOK OF HOMET", "domain": "典籍", "domain_en": "CODEX", "level": 7, "type": "术典", "recall": 0, "effect": "<strong><em>畅行无阻：</em></strong> 进行一次<strong>施法掷骰 (13)</strong>。每次休息一次，成功时，你和所有接触你的生物可以穿过近距离范围内的一堵墙或一扇门。当所有人都到达另一侧时，效果结束。\n<strong><em>异界之门：</em></strong> 进行一次<strong>施法掷骰 (14)</strong>。每长休一次，成功时，打开一个通往你曾去过的另一个维度或存在位面的传送门。此传送门持续到你的下一次休息。", "meta": "7 级 典籍 术典 回想费用：0"}, {"name": "典籍恩泽 CODEX-TOUCHED", "domain": "典籍", "domain_en": "CODEX", "level": 7, "type": "能力", "recall": 2, "effect": "当你配置中的领域卡有 <strong>4</strong> 张或更多属于典籍领域时，获得下列增益：\n- 你可以<strong>标记 1 压力点</strong>，在一次施法掷骰中加上你的熟练值。\n- 每次休息一次，你可以用你宝库中的任意一张卡牌替换此卡牌，无需支付其回想费用。", "meta": "7 级 典籍 能力 回想费用：2"}, {"name": "维奥拉之书 BOOK OF VYOLA", "domain": "典籍", "domain_en": "CODEX", "level": 8, "type": "术典", "recall": 2, "effect": "<strong><em>深掘记忆：</em></strong> 对远距离范围内的一个目标进行一次<strong>施法掷骰</strong>。成功时，窥探目标的思想并向游戏主持人提出一个问题。游戏主持人描述目标与答案相关的任何记忆。\n<strong><em>共享明晰：</em></strong> 每长休一次，<strong>花费 1 希望点</strong>选择两个自愿生物。当其中一个生物将要标记压力时，他们可以选择由他们中的哪一个来标记。此法术持续到他们下一次休息。", "meta": "8 级 典籍 术典 回想费用：2"}, {"name": "避风港湾 SAFE HAVEN", "domain": "典籍", "domain_en": "CODEX", "level": 8, "type": "法术", "recall": 3, "effect": "当你拥有几分钟的平静来集中精神时，你可以<strong>花费 2 希望点</strong>召唤你的庇护所，这是一个大型维度的居所，你和你的盟友可以在其中避难。当你这样做时，一扇魔法门会出现在近距离范围内的某个地方。只有你选择的生物才能进入。进入后，你可以使入口隐形。你和里面的任何其他人总是可以离开。一旦你离开，必须再次召唤入口。\n当你在你自己的庇护所内休息时，你可以选择一个额外的休整行动。", "meta": "8 级 典籍 法术 回想费用：3"}, {"name": "罗宁之书 BOOK OF RONIN", "domain": "典籍", "domain_en": "CODEX", "level": 9, "type": "术典", "recall": 4, "effect": "<strong><em>变形：</em></strong> 进行一次<strong>施法掷骰 (15)</strong>。成功时，变形为一个不超过你正常体型两倍的无生命物体。你可以保持这个形态直到受到伤害。\n<strong><em>永恒衰弱：</em></strong> 每长休一次，对近距离范围内的一个目标进行一次<strong>施法掷骰</strong>。成功时，使其永久变为 <em>脆弱</em> 状态。其无法通过任何方式清除此状态。", "meta": "9 级 典籍 术典 回想费用：4"}, {"name": "解离波 DISINTEGRATION WAVE", "domain": "典籍", "domain_en": "CODEX", "level": 9, "type": "法术", "recall": 4, "effect": "进行一次<strong>施法掷骰 (18)</strong>。每长休一次，成功时，游戏主持人会告诉你远距离范围内哪些敌人的难度为 <strong>18</strong> 或更低。对于每一个你想用此法术命中的目标，<strong>标记 1 压力点</strong>。目标会被杀死，并且无法通过任何方式复活。", "meta": "9 级 典籍 法术 回想费用：4"}, {"name": "亚罗之书 BOOK OF YARROW", "domain": "典籍", "domain_en": "CODEX", "level": 10, "type": "术典", "recall": 2, "effect": "<strong><em>时间停滞：</em></strong> 进行一次<strong>施法掷骰 (18)</strong>。成功时，远距离范围内除了你之外的所有生物时间暂时停止。当你进行一次以其他生物为目标的动作掷骰时，时间恢复流动。\n<strong><em>魔法免疫：</em></strong> <strong>花费 5 希望点</strong>，直到你下次休息前对魔法伤害免疫。", "meta": "10 级 典籍 术典 回想费用：2"}, {"name": "超凡联结 TRANSCENDENT UNION", "domain": "典籍", "domain_en": "CODEX", "level": 10, "type": "法术", "recall": 1, "effect": "每长休一次，<strong>花费 5 希望点</strong>将此法术施加在两个或更多自愿的生物身上。在你下次休息前，当处于联结状态的生物需要<strong>标记压力点</strong>或<strong>生命点</strong>时，被联结的生物可以选择由谁来标记。", "meta": "10 级 典籍 法术 回想费用：1"}, {"name": "欺瞒熟手 DEFT DECEIVER", "domain": "优雅", "domain_en": "GRACE", "level": 1, "type": "能力", "recall": 0, "effect": "<strong>花费 1 希望点</strong>，在欺瞒或哄骗某人相信你谎言的掷骰中获得优势。", "meta": "1 级 优雅 能力 回想费用：0"}, {"name": "心醉神迷 ENRAPTURE", "domain": "优雅", "domain_en": "GRACE", "level": 1, "type": "法术", "recall": 0, "effect": "对近距离范围内的一个目标进行一次<strong>施法掷骰</strong>。成功时，目标暂时处于 <em>迷醉</em> 状态。处于 <em>迷醉</em> 状态时，目标的注意力会固定在你身上，视野变窄，且听不到除你声音外的任何声音。每休息一次，在成功时，你可以<strong>标记 1 压力点</strong>迫使处于 <em>迷醉</em> 状态的目标也<strong>标记 1 压力点</strong>。", "meta": "1 级 优雅 法术 回想费用：0"}, {"name": "豪言壮语 INSPIRATIONAL WORDS", "domain": "优雅", "domain_en": "GRACE", "level": 1, "type": "能力", "recall": 1, "effect": "你的言语中蕴含着力量。在一次长休后，在此卡牌上放置等同于你风度值的指示物。当你与一位盟友交谈时，你可以花费此卡牌上的一个指示物，给予该盟友下列选项中的一项增益：\n- 该盟友<strong>清除 1 压力点</strong>。\n- 该盟友<strong>恢复 1 生命点</strong>。\n- 该盟友<strong>获得 1 希望点</strong>。\n当你进行长休时，移除所有未花费的指示物。", "meta": "1 级 优雅 能力 回想费用：1"}, {"name": "无可讳言 TELL NO LIES", "domain": "优雅", "domain_en": "GRACE", "level": 2, "type": "法术", "recall": 1, "effect": "对邻近距离范围内的一个目标进行一次<strong>施法掷骰</strong>。成功时，只要其在近距离范围内，就不能对你说谎，但可以保持沉默。如果你问其一个问题而对方拒绝回答，则对方必须<strong>标记 1 压力点</strong>，且此效果结束。目标通常不会意识到此法术已施加在自己身上，直到此法术导致其说出真相。", "meta": "2 级 优雅 法术 回想费用：1"}, {"name": "惹是生非 TROUBLEMAKER", "domain": "优雅", "domain_en": "GRACE", "level": 2, "type": "能力", "recall": 2, "effect": "当你在远距离范围内嘲弄或挑衅一个目标时，对其进行一次<strong>风度掷骰</strong>。每次休息一次，成功时，掷出数量等同于你熟练值的 <strong>d4</strong>。目标必须标记等同于掷出最高结果的压力点。", "meta": "2 级 优雅 能力 回想费用：2"}, {"name": "催眠闪光 HYPNOTIC SHIMMER", "domain": "优雅", "domain_en": "GRACE", "level": 3, "type": "法术", "recall": 1, "effect": "对近距离范围内你面前的所有敌人，进行一次<strong>施法掷骰</strong>。每休息一次，成功时，创造一个色彩变换的闪光幻象，暂时使你成功对抗的目标处于 <em>眩晕</em> 状态，并迫使其<strong>标记 1 压力点</strong>。在处于<em>眩晕</em> 状态期间，其无法使用反应，且在清除此状态之前无法进行任何其他动作。", "meta": "3 级 优雅 法术 回想费用：1"}, {"name": "无影无踪 INVISIBILITY", "domain": "优雅", "domain_en": "GRACE", "level": 3, "type": "法术", "recall": 1, "effect": "进行一次<strong>施法掷骰 (10)</strong>。成功时，<strong>标记 1 压力点</strong>，并选择自己或近战范围内的一名盟友变为<em>隐形</em> 状态。处于 <em>隐形</em> 状态的生物除了通过魔法手段外无法被看见，并且对其进行的攻击掷骰带有劣势。在此卡牌上放置数量等同于你施法属性的指示物。当处于 <em>隐形</em> 状态的生物采取行动时，花费此卡牌上的一个指示物。在花费最后一个指示物的行动结算后，此效果结束。\n你一次只能使一个生物维持隐形状态。", "meta": "3 级 优雅 法术 回想费用：1"}, {"name": "宽慰言语 SOOTHING SPEECH", "domain": "优雅", "domain_en": "GRACE", "level": 4, "type": "能力", " 标记 1 压力点</strong>。\n- 当你会迫使目标标记一定数量的生命点时，你可以选择改为迫使其<strong>标记等量的压力点</strong>。", "meta": "7 级 优雅 能力 回想费用：2"}, {"name": "星界投影 ASTRAL PROJECTION", "domain": "优雅", "domain_en": "GRACE", "level": 8, "type": "法术", "recall": 0, "effect": "每长休一次，<strong>标记 1 压力点</strong>来创造一个你的投射分身，它可以出现在你曾经到过的任何地方。\n你可以通过投射分身，如同你本人般观察、聆听，甚至影响世界。调查投射分身的生物可以分辨出其源于魔法。此效果持续到你下次休息或你的投射分身受到任何伤害。", "meta": "8 级 优雅 法术 回想费用：0"}, {"name": "群体心醉神迷 MASS ENRAPTURE", "domain": "优雅", "domain_en": "GRACE", "level": 8, "type": "法术", "recall": 3, "effect": "对远距离范围内所有目标进行一次<strong>施法掷骰</strong>。你成功对抗的目标会暂时处于 <em>迷醉</em> 状态。处于 <em>迷醉</em> 状态时，目标的注意力会完全集中在你身上，视野变得狭窄，除了你的声音外听不到任何其他声音。<strong>标记 1 压力点</strong>可以迫使所有处于 <em>迷醉</em> 状态的目标<strong>标记 1 压力点</strong>，从而结束此法术。", "meta": "8 级 优雅 法术 回想费用：3"}, {"name": "如法炮制 COPYCAT", "domain": "优雅", "domain_en": "GRACE", "level": 9, "type": "法术", "recall": 3, "effect": "每长休一次，此卡牌可以模仿另一个玩家配置中等级为 <strong>8</strong> 或更低的其他领域卡牌的特性。<strong>花费等同该卡牌等级一半的希望点</strong>来获得该特性。模仿效果持续到你下次休息或该玩家将被模仿的卡牌放入宝库。", "meta": "9 级 优雅 法术 回想费用：3"}, {"name": "技艺大师 MASTER OF THE CRAFT", "domain": "优雅", "domain_en": "GRACE", "level": 9, "type": "能力", "recall": 0, "effect": "使你的两项经历永久获得 <strong>+2</strong> 加值，或使你的一项经历永久获得 <strong>+3</strong> 加值。然后将此卡牌永久放入你的宝库。", "meta": "9 级 优雅 能力 回想费用：0"}, {"name": "再次上演 ENCORE", "domain": "优雅", "domain_en": "GRACE", "level": 10, "type": "法术", "recall": 1, "effect": "当近距离范围内的一名盟友对一个敌人造成伤害时，你可以对同一目标进行一次<strong>施法掷骰</strong>。成功时，你对该目标造成与你的盟友相同的伤害。如果你的施法掷骰恐惧成功，则将此卡牌放入你的宝库。", "meta": "10 级 优雅 法术 回想费用：1"}, {"name": "恶名昭彰 NOTORIOUS", "domain": "优雅", "domain_en": "GRACE", "level": 10, "type": "能力", "recall": 0, "effect": "人们知道你是谁，以及你做过什么，因此他们对待你的方式与众不同。当你利用你的恶名来达成目的时，你可以在掷骰前<strong>标记 1 压力点</strong>，从而使结果获得 <strong>+10</strong> 加值。无论你走到哪里，你的食物和饮料总是免费，你购买的其他任何物品价格都会减少一袋金币（最低为一把金币）。\n此卡牌不计入你的配置领域牌上限 <strong>5</strong> 张，且不能放入你的宝库。", "meta": "10 级 优雅 能力 回想费用：0"}, {"name": "妙手空空 PICK AND PULL", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 1, "type": "能力", "recall": 0, "effect": "你在撬开非魔法锁、解除非魔法陷阱或从一个目标处盗窃物品（无论是偷是抢）的动作掷骰上具有优势。", "meta": "1 级 午夜 能力 回想费用：0"}, {"name": "滂沱剑雨 RAIN OF BLADES", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 1, "type": "法术", "recall": 1, "effect": "<strong>花费 1 希望点</strong> 进行一次<strong>施法掷骰</strong>，召唤出数把投掷利剑，攻击邻近范围内的所有目标。你成功对抗的目标将受到使用你的熟练值的 <strong>d8+2</strong> 点魔法伤害。\n如果你命中的目标处于 <em>脆弱</em> 状态，其会额外受到 <strong>1d8</strong> 点伤害。", "meta": "1 级 午夜 法术 回想费用：1"}, {"name": "奇异伪装 UNCANNY DISGUISE", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 1, "type": "法术", "recall": 0, "effect": "当你有数分钟用以准备时，你可以<strong>标记 1 压力点</strong>来伪装成你脑海中能清晰描绘的任何人形生物。伪装期间，你在逃避检查的风度掷骰上具有优势。\n将与你的施法属性值等量的指示物放在此卡牌上。当你在伪装下执行动作时，花费此卡牌上的 <strong>1</strong> 个指示物。花费最后一个指示物的动作结算后，伪装解除。", "meta": "1 级 午夜 法术 回想费用：0"}, {"name": "午夜精魂 MIDNIGHT SPIRIT", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 2, "type": "法术", "recall": 1, "effect": "<strong>花费 1 希望点</strong> 召唤一个人形大小的精魂，它可以为你移动或携带物品，直到你下次休息。\n你也可以派遣它攻击一个敌人。当你这样做时，对极远范围内的一个目标进行一次<strong>施法掷骰</strong>。成功时，精魂移动到该目标的近战范围内。掷出等同于你施法属性值的 <strong>d6</strong>，并对目标造成等量魔法伤害。之后精魂消散。你一次只能拥有一个精魂。", "meta": "2 级 午夜 法术 回想费用：1"}, {"name": "暗影束缚 SHADOWBIND", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 2, "type": "法术", "recall": 0, "effect": "对邻近范围内的所有敌人，进行一次<strong>施法掷骰</strong>。你成功对抗的目标会被暂时处于 <em>束缚</em> 状态，其影子会将其固定在原地。", "meta": "2 级 午夜 法术 回想费用：0"}, {"name": "锁喉勒颈 CHOKEHOLD", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 3, "type": "能力", "recall": 1, "effect": "当你位于与你体型相仿的生物身后时，你可以<strong>标记 1 压力点</strong>将其锁喉，使其暂时处于 <em>脆弱</em> 状态。\n当一个生物攻击以这种方式处于 <em>脆弱</em> 状态的目标时，额外造成 <strong>2d6</strong> 伤害。", "meta": "3 级 午夜 能力 回想费用：1"}, {"name": "暗夜帷幕 VEIL OF NIGHT", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 3, "type": "法术", "recall": 1, "effect": "进行一次<strong>施法掷骰 (13)</strong>。成功时，你可以在远距离范围内的两点之间创造一道临时的黑暗帷幕。只有你能看穿这片黑暗。对帷幔另一侧的敌人而言，你处于 <em>隐藏</em> 状态，并且你穿过帷幕进行的攻击具有优势。帷幕会一直存在，直到你施放另一个法术。", "meta": "3 级 午夜 法术 回想费用：1"}, {"name": "潜行专家 STEALTH EXPERTISE", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 4, "type": "能力", "recall": 0, "effect": "当你试图在危险区域中不被察觉地移动时，如果你掷出恐惧结果，你可以<strong>标记 1 压力点</strong>改为掷出希望结果。\n如果邻近范围内的盟友也在试图不被察觉地移动且掷出恐惧结果，你可以<strong>标记 1 压力点</strong>将其结果改为掷出希望结果。", "meta": "4 级 午夜 能力 回想费用：0"}, {"name": "夜幕符文 GLYPH OF NIGHTFALL", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 4, "type": "法术", "recall": 1, "effect": "对邻近范围内的一个目标进行一次<strong>施法掷骰</strong>。成功时，<strong>花费 1 希望点</strong>在其身上召唤一个黑暗符文，暴露其弱点，暂时降低目标等同于你的知识的难度（至少为 <strong>1</strong> ）。", "meta": "4 级 午夜 法术 回想费用：1"}, {"name": "沉默不言 HUSH", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 5, "type": "法术", "recall": 1, "effect": "对邻近范围内的一个目标进行一次<strong>施法掷骰</strong>。成功时，<strong>花费 1 希望点</strong>在目标周围召唤压制魔法，笼罩其邻近范围内的所有事物，并随目标移动而移动。\n目标和区域内的任何事物都处于 <em>寂静</em> 状态，直到游戏主持人在其轮次<strong>花费 1 恐惧点</strong>来清除此状态，或者你再次施放沉默不言，或者你受到重度伤害。处于 <em>寂静</em> 状态时，其无法发出声音，也无法施放法术。", "meta": "5 级 午夜 法术 回想费用：1"}, {"name": "移形换影 PHANTOM RETREAT", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 5, "type": "法术", "recall": 2, "effect": "<strong>花费 1 希望点</strong>，在你当前所在位置激活移形换影。在下次休息之前的任何时候再<strong>花费 1 希望点</strong>，从你当前所在位置消失，并重新出现在你激活移形换影时所在位置。你重新出现后，此法术结束。", "meta": "5 级 午夜 法术 回想费用：2"}, {"name": "黑暗低语 DARK WHISPERS", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 6, "type": "法术", "recall": 0, "effect": "你可以与任何你发生过肢体接触的人进行精神交流。一旦你与其建立了联系，其也可以对你进行精神回应。此外，你可以<strong>标记 1 压力点</strong>对其进行一次<strong>施法掷骰</strong>。成功时，你可以向游戏主持人询问下列问题之一并获得答案：\n- 对方在哪里？\n- 对方在做什么？\n- 对方害怕什么？\n- 对方最珍视什么？", "meta": "6 级 午夜 法术 回想费用：0"}, {"name": "群体伪装 MASS DISGUISE", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 6, "type": "法术", "recall": 0, "effect": "当你拥有片刻宁静专注施法时，你可以<strong>标记 1 压力点</strong>来改变邻近范围内所有自愿生物的外观。他们的新形态必须具有相似的身体结构和大小，伪装后的形态可以是你看过，也可以是完全虚构的人或物品。处于伪装的生物在进行逃避检查的风度掷骰中获得优势。\n激活一个倒计时（8）。它会根据游戏主持人选择的后果而减少。当倒计时结束时，伪装失效。", "meta": "6 级 午夜 法术 回想费用：0"}, {"name": "午夜恩泽 MIDNIGHT-TOUCHED", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 7, "type": "能力", "recall": 2, "effect": "当你的配置中有 <strong>4</strong> 张或更多领域卡来自午夜领域时，获得下列增益：\n- 每次休息一次，当你<strong>拥有 0 希望点</strong>且游戏主持人将<strong>获得 1 恐惧点</strong>时，你可以改为<strong>获得 1 希望点</strong>。\n- 当你进行一次成功的攻击时，你可以<strong>标记 1 压力点</strong>，将你的恐惧骰结果加到你的伤害掷骰中。", "meta": "7 级 午夜 能力 回想费用：2"}, {"name": "无踪影遁 VANISHING DODGE", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 7, "type": "法术", "recall": 1, "effect": "当一次针对你且会造成物理伤害的攻击失败时，你可以<strong>花费 1 希望点</strong>，将自己包裹在阴影中，进入 <em>隐藏</em> 状态，并传送到攻击者邻近范围内的任意一点。你将保持 <em>隐藏</em> 状态，直到你下一次进行动作掷骰。", "meta": "7 级 午夜 法术 回想费用：1"}, {"name": "暗影猎手 SHADOWHUNTER", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 8, "type": "能力", "recall": 2, "effect": "在阴影的掩护下，你的技艺得到增强。当你在微光环境下或黑暗中被遮蔽时，你的闪避值获得 <strong>+1</strong> 加值，并且进行攻击掷骰时获得优势。", "meta": "8 级 午夜 能力 回想费用：2"}, {"name": "法术充能 SPELLCHARGE", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 8, "type": "法术", "recall": 1, "effect": "当你受到魔法伤害时，在此卡牌上放置等同于你因此次魔法伤害标记的生命点的指示物。你可以储存数量等同于你施法属性的指示物。\n当你对一个目标进行一次成功的攻击时，你可以花费任意数量的指示物，每花费一个指示物就为你的伤害掷骰增加一个 <strong>d6</strong>。", "meta": "8 级 午夜 法术 回想费用：1"}, {"name": "夜魇降临 NIGHT TERROR", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 9, "type": "法术", "recall": 2, "effect": "每长休一次，选择邻近范围内的任意目标，使其感知你为一种噩梦般的恐怖存在。目标必须进行一次成功的反应掷骰（难度 <strong>16</strong> ），否则暂时处于 <em>惊惧</em> 状态。处于 <em>惊惧</em> 状态时，他们获得 <em>脆弱</em> 状态。从游戏主持人处窃取等同于 <em>惊惧</em> 目标数量的恐惧点（最多不超过游戏主持人恐惧点池中的数量）。掷出等同于窃取的恐惧点数量的 <strong>d6</strong>，并将总伤害值分配给每个处于 <em>惊惧</em> 状态的目标。丢弃窃取的恐惧点。", "meta": "9 级 午夜 法术 回想费用：2"}, {"name": "暮光丧钟 TWILIGHT TOLL", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 9, "type": "能力", "recall": 1, "effect": "选择远距离范围内的一个目标。当你对其进行一次成功的动作掷骰，且该掷骰未导致进行伤害掷骰时，在此卡上放置一个指示物。当你对该目标造成伤害时，花费任意数量的指示物，每花费一个指示物就为你的伤害掷骰增加一个 <strong>d12</strong>。你一次只能对一个生物施加暮光丧钟。\n当你选择一个新的目标或进行一次休息时，清除所有未花费的指示物。", "meta": "9 级 午夜 能力 回想费用：1"}, {"name": "日蚀无光 ECLIPSE", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 10, "type": "法术", "recall": 2, "effect": "进行一次<strong>施法掷骰（难度16）</strong>。每长休一次，成功后，将远距离范围内的整个区域笼罩在完全黑暗中，只有你和你的盟友才能看穿这片黑暗。当攻击掷骰的目标是处于黑暗中的你或盟友时，攻击掷骰具有劣势。\n此外，当处于黑暗中的你或盟友对敌人掷出希望成功时，目标必须<strong>标记 1 压力点</strong>。\n此法术持续到游戏主持人在其轮次<strong>花费 1 恐惧点</strong>以清除此效果，或你受到严重伤害为止。", "meta": "10 级 午夜 法术 回想费用：2"}, {"name": "黑暗幽影 SPECTER OF THE DARK", "domain": "午夜", "domain_en": "MIDNIGHT", "level": 10, "type": "法术", "recall": 1, "effect": "<strong>标记 1 压力点</strong>，你将变为 <em>幽影</em> 状态，直到你进行一次以另一个生物为目标的动作掷骰时，状态结束。处于 <em>幽影</em> 状态时，你免疫物理伤害，可以漂浮并穿过固体物体。处于此状态时，其他生物仍能看见你。", "meta": "10 级 午夜 法术 回想费用：1"}, {"name": "追猎才能 GIFTED TRACKER", "domain": "贤者", "domain_en": "SAGE", "level": 1, "type": "能力", "recall": 0, "effect": "当你根据特定生物或生物群体的踪迹进行追踪时，你可以<strong>花费任意数量的希望点</strong>，向游戏主持人提出等量下列问题。\n- 生物朝哪个方向去了？\n- 生物是多久之前经过这里的？\n- 生物在这个地方做了什么？\n- 生物数量几何？\n当你遭遇到以这种方式追踪到的生物时，与生物对抗时你的闪避值获得 <strong>+1</strong> 加值。", "meta": "1 级 贤者 能力 回想费用：0"}, {"name": "自然之语 NATURE'S TONGUE", "domain": "贤者", "domain_en": "SAGE", "level": 1, "type": "能力", "recall": 0, "effect": "你会说自然界的语言。当你想要与周围的植物和动物交谈时，进行一次<strong>本能掷骰 (12)</strong>。成功时，它们会告诉你它们所知道的信息。掷出恐惧结果时，它们了解的内容可能有限或需要付出一定代价。\n此外，在自然环境中进行施法掷骰之前，你可以<strong>花费 1 希望点</strong>，使该掷骰结果获得 <strong>+2</strong> 加值。", "meta": "1 级 贤者 能力 回想费用：0"}, {"name": "怨毒缠绕 VICIOUS ENTANGLE", "domain": "贤者", "domain_en": "SAGE", "level": 1, "type": "法术", "recall": 1, "effect": "对远距离范围内的一个目标进行一次<strong>施法掷骰</strong>。成功时，根须和藤蔓从地面伸出，造成 <strong>1d8+1</strong> 点物理伤害，并暂时使目标处于 <em>束缚</em> 状态。\n此外，成功时，你可以<strong>花费 1 希望点</strong>来暂时使你目标邻近范围内的另一个敌人也处于 <em>束缚</em> 状态。", "meta": "1 级 贤者 法术 回想费用：1"}, {"name": "召唤虫群 CONJURE SWARM", "domain": "贤者", "domain_en": "SAGE", "level": 2, "type": "法术", "recall": 1, "effect": "<em>泰凯拉装甲甲虫：</em> <strong>标记 1 压力点</strong>，召唤装甲甲虫环绕你。当你下次受到伤害时，伤害降低一个等级。你可以<strong>花费 1 希望点</strong>在受到伤害后仍使甲虫保持被召唤状态。\n<em>萤火虫：</em> 对近距离范围内的所有敌人，进行一次<strong>施法掷骰</strong>。<strong>花费 1 希望点</strong>，对你成功对抗的目标造成 <strong>2d8+3</strong> 点魔法伤害。", "meta": "2 级 贤者 法术 回想费用：1"}, {"name": "自然魔宠 NATURAL FAMILIAR", "domain": "贤者", "domain_en": "SAGE", "level": 2, "type": "法术", "recall": 1, "effect": "<strong>花费 1 希望点</strong>，召唤一个小型的自然精魂或森林动物来到你身边，直到你下一次休息，再次施放自然魔宠，或魔宠被攻击锁定时失效。如果你额外<strong>花费 1 希望点</strong>，你可以召唤一只会飞行的魔宠。你可以与其交流，进行一次<strong>施法掷骰</strong>来指挥它们执行简单的任务，并<strong>标记 1 压力点</strong>来透过魔宠的眼睛观察。\n当你对魔宠近战范围内的敌人造成伤害时，你的伤害掷骰额外增加一个 <strong>d6</strong>。", "meta": "2 级 贤者 法术 回想费用：1"}, {"name": "腐蚀射弹 CORROSIVE PROJECTILE", "domain": "贤者", "domain_en": "SAGE", "level": 3, "type": "法术", "recall": 1, "effect": "对远距离范围内的一个目标进行一次<strong>施法掷骰</strong>。成功时，使用你的熟练值造成 <strong>d6+4</strong> 点魔法伤害。此外，<strong>标记2或更多压力点</strong>使其永久处于 <em>腐蚀</em> 状态。目标处于 <em>腐蚀</em> 状态时，每<strong>花费 2 压力点</strong>，以其为目标的掷骰难度就会受到 <strong>-1</strong> 减值。此状态可以叠加。", "meta": "3 级 贤者 法术 回想费用：1"}, {"name": "高茎成塔 TOWERING STALK", "domain": "贤者", "domain_en": "SAGE", "level": 3, "type": "法术", "recall": 1, "effect": "每次休息一次，你可以在近距离范围内召唤一根粗壮、扭曲的茎干，可供轻松攀爬。它可以长到远距离范围的高度。\n<strong>标记 1 压力点</strong>来将此法术作为攻击法术使用。对近距离范围内的敌人或敌群进行一次<strong>施法掷骰</strong>。凌空爆涨的茎干会将你成功对抗的目标抬到空中并将其摔落，使用你的熟练值造成 <strong>d8</strong> 点物理伤害。", "meta": "3 级 贤者 法术 回想费用：1"}, {"name": "死亡卷握 DEATH GRIP", "domain": "贤者", "domain_en": "SAGE", "level": 4, "type": "法术", "recall": 1, "effect": "对近距离范围内的一个目标进行一次<strong>施法掷骰</strong>，并选择下列选项之一：\n- 你将目标拉入近战范围，或将自己拉入目标的近战范围。\n- 你缠绕目标，迫使其<strong>标记 2 压力点</strong>。\n- 你与目标之间的所有敌人必须成功进行一次反应掷骰（13），否则会被藤蔓击中，受到 <strong>3d6+2</strong> 点物理伤害。\n成功时，藤蔓会从你的手中伸出，造成所选效果并暂时使目标处于 <em>束缚</em> 状态。", "meta": "4 级 贤者 法术 回想费用：1"}, {"name": "治疗之域 HEALING FIELD", "domain": "贤者", "domain_en": "SAGE", "level": 4, "type": "法术", "recall": 2, "effect": "每长休一次，你可以在自己周围召唤一片遍布治疗植物的领域。你近距离范围内到处都充满了生机勃勃的自然气息，使你和该区域内的所有盟友都能<strong>恢复 1 生命点</strong>。\n<strong>花费 2 希望点</strong>，使你和所有盟友改为<strong>恢复 2 生命点</strong>。", "meta": "4 级 贤者 法术 回想费用：2"}, {"name": "荆棘皮肤 THORN SKIN", "domain": "贤者", "domain_en": "SAGE", "level": 5, "type": "法术", "recall": 1, "effect": "每次休息一次，<strong>花费 1 希望点</strong>，使你的全身长出荆棘。当你这样做时，在此卡上放置等同于你的施法属性数量的指示物。当你受到伤害时，你可以花费任意数量的指示物，掷出相应数量的 <strong>d6</strong>。将结果相加，并减少等量所受伤害。如果你在攻击者的近战范围内，则将等量的伤害反弹给对方。\n当你休息时，清除所有未使用的指示物。", "meta": "5 级 贤者 法术 回想费用：1"}, {"name": "荒野壁垒 WILD FORTRESS", "domain": "贤者", "domain_en": "SAGE", "level": 5, "type": "法术", "recall": 1, "effect": "进行一次<strong>施法掷骰 (13)</strong>。成功时，<strong>花费 2 希望点</strong>，生长出一个天然的圆顶形屏障，你和一名盟友可以在其中躲藏。身处圆顶内的生物不能成为攻击目标，也不能进行攻击。针对圆顶的攻击自动成功。圆顶具有以下伤害阈值，持续到<strong>标记 3 生命点</strong>为止。在此卡上放置指示物来表示标记的生命点。\n阈值：15/30", "meta": "5 级 贤者 法术 回想费用：1"}, {"name": "召唤坐骑 CONJURED STEEDS", "domain": "贤者", "domain_en": "SAGE", "level": 6, "type": "法术", "recall": 0, "effect": "<strong>花费任意数量的希望点</strong>，召唤等量的魔法坐骑（例如马、骆驼或大象），可以供你和你的盟友骑乘，直到你的下一次长休或坐骑受到任何伤害。坐骑可以使你旅行时的陆上行进速度翻倍，面临危险时，允许你在远距离范围内移动而无需掷骰。骑乘战马的生物攻击掷骰会受到 <strong>-2</strong> 的减值，伤害掷骰获得 <strong>+2</strong> 的加值。", "meta": "6 级 贤者 法术 回想费用：0"}, {"name": "丰收采集 FORAGER", "domain": "贤者", "domain_en": "SAGE", "level": 6, "type": "能力", "recall": 1, "effect": "作为你的一个额外休整行动可选项，掷一个 <strong>d6</strong> ，看看你采集到什么。与游戏主持人一起描述它，并将其作为消耗品添加到你的物品栏中。你的队伍一次最多可以携带五件采集到的消耗品。\n- 1. 一份独特的食物 (<strong>清除 2 压力点</strong><br/>\n- 2. 一件美丽的圣物 (<strong>获得 2 希望点</strong><br/>\n- 3. 一枚奥术符文 (在一次施法掷骰中获得 <strong>+2</strong> 加值\n- 4. 一瓶治疗药剂 (<strong>恢复 2 生命点</strong><br/>\n- 5. 一个幸运护身符 (重掷任意一个骰子\n- 6. 从以上选项中自选一个。", "meta": "6 级 贤者 能力 回想费用：1"}, {"name": "贤者恩泽 SAGE-TOUCHED", "domain": "贤者", "domain_en": "SAGE", "level": 7, "type": "能力", "recall": 2, "effect": "当你的配置中有 <strong>4</strong> 张或更多的领域卡来自贤者领域时，获得下列增益：\n- 当你在自然环境中时，你的施法掷骰获得 <strong>+2</strong> 加值。\n- 每休息一次，你在进行使用敏捷或本能属性的掷骰时，可以使你的敏捷或本能属性翻倍。你必须在掷骰前进行选择。", "meta": "7 级 贤者 能力 回想费用：2"}, {"name": "狂野浪涌 WILD SURGE", "domain": "贤者", "domain_en": "SAGE", "level": 7, "type": "法术", "recall": 2, "effect": "每长休一次，<strong>标记 1 压力点</strong>，引导你周围的自然世界并增强自身。描述你的外表如何变化，然后将一个 <strong>d6</strong> 骰子放在这张卡上， <strong>1</strong> 朝上。\n当狂野浪涌骰激活时，你将其作为加值加到你进行的每一次动作掷骰中。每当你将其值加到一次掷骰后，将狂野浪涌骰的骰值增加 <strong>1</strong> 。当骰值将超过 <strong>6</strong> 或你休息时，该形态消失，然后你必须额外<strong>标记 1 压力点</strong>。", "meta": "7 级 贤者 法术 回想费用：2"}, {"name": "森林精魂 FOREST SPRITES", "domain": "贤者", "domain_en": "SAGE", "level": 8, "type": "法术", "recall": 2, "effect": "进行一次<strong>施法掷骰 (13)</s el": 7, "type": "能力", "recall": 1, "effect": "当你配置中的领域卡有 <strong>4</strong> 张或更多来自勇气领域时，获得下列增益：\n- 你的护甲值获得 +1 加值。\n- 当你<strong>标记 1 点或更多生命点</strong>而未<strong>标记护甲槽</strong>时，<strong>恢复 1 护甲槽</strong>。", "meta": "7 级 勇气 能力 回想费用：1"}, {"name": "火力全开 FULL SURGE", "domain": "勇气", "domain_en": "VALOR", "level": 8, "type": "能力", "recall": 1, "effect": "每长休一次，<strong>标记 3 压力点</strong>来将你的机能发挥至极限。你的所有角色属性获得 +2 加值，直到你下次休息。", "meta": "8 级 勇气 能力 回想费用：1"}, {"name": "撼地猛击 GROUND POUND", "domain": "勇气", "domain_en": "VALOR", "level": 8, "type": "能力", "recall": 2, "effect": "<strong>花费 2 希望点</strong>来猛砸你所在位置的地面，并对邻近范围内的所有目标，进行一次<strong>力量掷骰</strong>。你成功对抗的目标会被击退至远距离范围，并且必须进行一次反应掷骰 (17)。失败的目标承受 <strong>4d10+8</strong> 点伤害。成功的目标承受一半伤害。", "meta": "8 级 勇气 能力 回想费用：2"}, {"name": "坚守阵线 HOLD THE LINE", "domain": "勇气", "domain_en": "VALOR", "level": 9, "type": "能力", "recall": 1, "effect": "描述你采取的防御姿态并<strong>花费 1 希望点</strong>。如果一个敌人移动至邻近范围内，其会被拉入近战范围并处于 <em>束缚</em> 状态。\n该状态持续到你移动或掷出恐惧失败，或者游戏主持人在其轮次<strong>花费 2 恐惧点</strong>来清除该状态。", "meta": "9 级 勇气 能力 回想费用：1"}, {"name": "以身作则 LEAD BY EXAMPLE", "domain": "勇气", "domain_en": "VALOR", "level": 9, "type": "能力", "recall": 3, "effect": "当你对一个敌人造成伤害时，你可以<strong>标记 1 压力点</strong>并描述你如何鼓励你的盟友。下一个对该敌人进行攻击的玩家角色可以<strong>清除 1 压力点</strong>或<strong>获得 1 希望点</strong>。", "meta": "9 级 勇气 能力 回想费用：3"}, {"name": "坚不可摧 UNBREAKABLE", "domain": "勇气", "domain_en": "VALOR", "level": 10, "type": "能力", "recall": 4, "effect": "当你标记最后一个生命点时，你可以改为掷一个 <strong>d6</strong> 并<strong>恢复等量的生命点</strong>，而不是进行一次死亡行动。然后将此卡牌放入你的宝库。", "meta": "10 级 勇气 能力 回想费用：4"}, {"name": "不灭甲胄 UNYIELDING ARMOR", "domain": "勇气", "domain_en": "VALOR", "level": 10, "type": "能力", "recall": 1, "effect": "当你本应<strong>标记 1 护甲槽</strong>时，掷等同于你熟练值的 <strong>d6</strong>。如果掷出 <strong>6</strong> ，则将伤害的严重程度降低一个阈值，而无需<strong>标记护甲槽</strong>。", "meta": "10 级 勇气 能力 回想费用：1"}];
const DOMAIN_COLORS = {"奥术": "#8b5cf6", "利刃": "#ef4444", "骸骨": "#78716c", "典籍": "#3b82f6", "优雅": "#ec4899", "午夜": "#4c1d95", "贤者": "#14b8a6", "辉耀": "#f59e0b", "勇气": "#b91c1c"};

let drawn=[], revealed=[], spinning=false, flickerTimer=null, stopTimers=[];

function $(id){return document.getElementById(id);}

function init(){
  const dc=$('domains');
  DOMAINS.forEach((d,idx)=>{
    const cn=d.cn, en=d.en, color=DOMAIN_COLORS[cn]||'#888';
    const count=CARDS.filter(c=>c.domain===cn).length;
    const label=document.createElement('label');
    label.className='chip';
    const checked = idx===0 ? 'checked' : '';
    label.innerHTML='<input type="checkbox" value="'+cn+'" '+checked+'><span class="dot" style="background:'+color+'"></span><span>'+cn+' <small style="color:var(--muted)">('+count+')</small></span>';
    dc.appendChild(label);
  });
  const lv=$('levels');
  const levels=[...new Set(CARDS.map(c=>c.level).filter(l=>l!==null))].sort((a,b)=>a-b);
  levels.forEach(L=>{
    const label=document.createElement('label');
    label.className='chip';
    label.innerHTML='<input type="checkbox" value="'+L+'" checked><span>'+L+' 级</span>';
    lv.appendChild(label);
  });
  render();
}

function selectedDomains(){return Array.from(document.querySelectorAll('#domains input:checked')).map(i=>i.value);}
function selectedLevels(){return Array.from(document.querySelectorAll('#levels input:checked')).map(i=>parseInt(i.value));}

function activePool(){
  const doms=selectedDomains();
  const levels=selectedLevels();
  return CARDS.filter(c=>doms.includes(c.domain) && levels.includes(c.level));
}

function draw(){
  if(spinning) return;
  const p=activePool();
  if(p.length===0){status('当前筛选条件下没有可用领域卡，请调整来源领域或等级。');return;}
  const n=Math.max(1,Math.min(10,parseInt($('drawCount').value)||5));
  const shuffled=[...p].sort(()=>Math.random()-0.5);
  drawn=shuffled.slice(0,Math.min(n,p.length));
  revealed=drawn.map(()=>false);
  spinning=true;
  $('drawBtn').disabled=true;
  clearTimers();
  render();
  status('抽取中…');
  flickerTimer=setInterval(()=>{
    for(let i=0;i<drawn.length;i++) if(!revealed[i]) flicker(i);
  },70);
  const base=2000;
  for(let i=0;i<drawn.length;i++){
    const t=base+i*200;
    const tm=setTimeout(()=>{
      revealed[i]=true;
      lockSlot(i);
      if(revealed.every(Boolean)){
        clearInterval(flickerTimer); flickerTimer=null;
        spinning=false;
        $('drawBtn').disabled=false;
        status('已抽取 '+drawn.length+' 张领域卡。');
      }
    },t);
    stopTimers.push(tm);
  }
}

function flicker(i){
  const el=$('slot-'+i);
  if(!el) return;
  const p=activePool();
  const r=p[Math.floor(Math.random()*p.length)];
  const color=DOMAIN_COLORS[r.domain]||'#888';
  el.innerHTML='<div class="slot-flick" style="color:'+color+'">'+escapeHtml(r.name)+'</div>';
}

function lockSlot(i){
  const el=$('slot-'+i);
  if(!el) return;
  el.innerHTML=cardInner(drawn[i],i);
  el.classList.add('locked','flash');
  setTimeout(()=>{ if(el) el.classList.remove('flash'); },450);
}

function cardInner(c,i){
  const color=DOMAIN_COLORS[c.domain]||'#888';
  return '<button class="del" title="移除这张领域卡" onclick="removeCard('+i+')">×</button>'+
    '<div class="top"><h3>'+escapeHtml(c.name)+'</h3></div>'+
    '<div class="meta">'+escapeHtml(c.meta||'')+'</div>'+
    '<div class="tags">'+
      '<span class="tag" style="color:'+color+'">'+escapeHtml(c.domain)+'</span>'+
      '<span class="tag">'+escapeHtml(typeClass(c.type))+'</span>'+
      '<span class="tag">'+(c.level!==null?c.level+'级':'等级?')+'</span>'+
      '<span class="tag">回想 '+recallText(c.recall)+'</span>'+
    '</div>'+
    '<div class="effect">'+c.effect+'</div>';
}

function render(){
  const r=$('result');
  if(!spinning && drawn.length===0){
    r.innerHTML='<div class="empty">尚未抽取领域卡，或英灵已消散。<br><span style="font-size:12px">点击上方「抽取领域卡」召唤英灵。</span></div>';
    return;
  }
  if(spinning){
    r.innerHTML='<div class="drawn">'+drawn.map((c,i)=>'<div class="c slot" id="slot-'+i+'" style="border-top:3px solid '+(DOMAIN_COLORS[c.domain]||'#888')+'"></div>').join('')+'</div>';
    for(let i=0;i<drawn.length;i++) flicker(i);
    return;
  }
  r.innerHTML='<div class="drawn">'+drawn.map((c,i)=>'<div class="c fade" style="border-top:3px solid '+(DOMAIN_COLORS[c.domain]||'#888')+'">'+cardInner(c,i)+'</div>').join('')+'</div>';
}

function removeCard(idx){
  drawn.splice(idx,1);
  revealed=revealed.filter((_,i)=>i!==idx);
  if(drawn.length===0){status('领域卡全部移除，该英灵消散。');render();return;}
  status('剩余 '+drawn.length+' 张领域卡。');
  render();
}
function clearAll(){
  clearTimers();
  drawn=[];revealed=[];spinning=false;
  $('drawBtn').disabled=false;
  status('领域卡全部移除，该英灵消散。');
  render();
}
function clearTimers(){
  if(flickerTimer){clearInterval(flickerTimer);flickerTimer=null;}
  stopTimers.forEach(t=>clearTimeout(t));
  stopTimers=[];
}
function status(msg){$('status').textContent=msg;}
function recallText(r){return r===null||r===undefined?'?':r;}
function typeClass(t){return t||'未知';}
function escapeHtml(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toggleTheme(){document.body.classList.toggle('light');}
function copyLink(){
  const url=location.href;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>status('分享链接已复制。')).catch(()=>fallbackCopy(url));
  } else { fallbackCopy(url); }
}
function fallbackCopy(url){
  const t=document.createElement('textarea');
  t.value=url; t.style.position='fixed'; t.style.opacity='0';
  document.body.appendChild(t); t.select();
  try{ document.execCommand('copy'); status('分享链接已复制。'); }
  catch(e){ status('复制失败，请手动复制地址栏链接。'); }
  document.body.removeChild(t);
}
function downloadOffline(){
  // 清空临时状态，导出干净副本
  const res=document.getElementById('result');
  const snapshot=res.innerHTML;
  res.innerHTML='';
  const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  res.innerHTML=snapshot;
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='降灵神通领域卡抽卡器.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  status('已导出离线版 HTML。');
}
init();
</script>
